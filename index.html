<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Quản Lý Mail Ảo - Debug Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <header class="text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-indigo-600">Trình Quản Lý Mail Ảo</h1>
      <p class="text-slate-500 text-xs mt-1">Hỗ trợ tra cứu theo ID & Email đầy đủ</p>
    </header>

    <!-- Token Section -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3">
      <input type="password" id="apiToken" placeholder="Nhập API Token..." class="flex-1 border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
      <button onclick="saveToken()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium">Lưu Token</button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Cột trái: Quản lý Email -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="font-semibold text-sm uppercase text-slate-500 tracking-wider">Tạo Hộp Thư</h2>
        <div>
          <label class="text-xs font-medium text-slate-600">Tên hòm thư (User)</label>
          <input type="text" id="username" placeholder="Để trống để tạo ngẫu nhiên" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="text-xs font-medium text-slate-600">Tên miền (Domain)</label>
          <input type="text" id="domain" value="tempmail.id.vn" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button id="btnCreate" onclick="createMail()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium text-sm transition">
          Tạo Mail Mới
        </button>

        <div id="currentMailBox" class="hidden pt-4 border-t border-slate-100 space-y-2">
          <label class="text-xs font-medium text-slate-600">Email hiện tại:</label>
          <div class="flex items-center gap-2">
            <input type="text" id="currentEmail" readonly class="w-full bg-slate-50 border rounded-lg px-2 py-1.5 text-xs font-mono">
            <button onclick="copyMail()" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1.5 rounded">Copy</button>
          </div>
          <p id="idInfo" class="text-[11px] text-slate-400 font-mono"></p>
        </div>
      </div>

      <!-- Cột phải: Hộp thư đến -->
      <div class="md:col-span-2 space-y-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold text-sm uppercase text-slate-500 tracking-wider flex items-center gap-2">
              Hộp Thư Đến
              <span id="pollStatus" class="hidden text-xs text-indigo-500 font-normal animate-pulse">● Đang quét</span>
            </h2>
            <button onclick="fetchMessages()" class="text-xs text-indigo-600 hover:underline font-medium">🔄 Làm mới ngay</button>
          </div>

          <ul id="messageList" class="divide-y divide-slate-100 text-sm">
            <li class="py-6 text-center text-slate-400">Chưa tạo hòm thư nào</li>
          </ul>
        </div>

        <!-- Chi tiết thư -->
        <div id="messageDetail" class="hidden bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="border-b pb-3">
            <h3 id="msgSubject" class="font-bold text-base text-slate-800"></h3>
            <p id="msgSender" class="text-xs text-slate-500 mt-1"></p>
          </div>
          <div id="msgBody" class="text-sm text-slate-700 leading-relaxed overflow-x-auto"></div>
        </div>
      </div>
    </div>

    <!-- Live Debug Log Viewer -->
    <div class="bg-slate-900 text-slate-200 p-4 rounded-xl text-xs font-mono space-y-2">
      <div class="flex justify-between items-center text-slate-400 pb-2 border-b border-slate-800">
        <span>Bảng Nhật Ký API (Debug Realtime)</span>
        <button onclick="document.getElementById('debugLog').innerText=''" class="hover:text-white">Xóa log</button>
      </div>
      <div id="debugLog" class="max-h-40 overflow-y-auto space-y-1">Chưa có hoạt động...</div>
    </div>

  </div>

  <script>
    const API_BASE = 'https://tempmail.id.vn/api';
    let currentMailId = null;
    let currentFullEmail = null;
    let pollInterval = null;

    function log(msg, type = 'info') {
      const box = document.getElementById('debugLog');
      const time = new Date().toLocaleTimeString();
      const color = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-emerald-400' : 'text-slate-300');
      box.innerHTML = `<div class="${color}">[${time}] ${escapeHtml(msg)}</div>` + box.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('tempmail_token');
      if (savedToken) document.getElementById('apiToken').value = savedToken;
    });

    function saveToken() {
      const token = document.getElementById('apiToken').value.trim();
      if (!token) return alert('Vui lòng nhập Token');
      localStorage.setItem('tempmail_token', token);
      log('Đã lưu Token mới!', 'success');
      alert('Đã lưu Token!');
    }

    function getToken() {
      return document.getElementById('apiToken').value.trim();
    }

    // Sửa lại hàm gọi API: chuẩn hóa cách ghép tham số và bỏ qua _t khi là POST/GET query
async function apiRequest(endpoint, method = 'GET', body = null) {
  const token = getToken();
  if (!token) throw new Error('Chưa cung cấp API Token');

  const targetUrl = `${API_BASE}${endpoint}`;
  // Nối URL qua corsproxy chính xác
  const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;

  const headers = {
    'Accept': 'application/json',
    'Authorization': `Bearer ${token}`
  };

  const options = { method, headers };
  if (body && method !== 'GET') {
    headers['Content-Type'] = 'application/json';
    options.body = JSON.stringify(body);
  }

  log(`Gửi ${method} -> ${endpoint}`);
  const res = await fetch(proxyUrl, options);
  const text = await res.text();

  try {
    const json = JSON.parse(text);
    return json;
  } catch (e) {
    throw new Error(`Phản hồi: ${text.slice(0, 150)}`);
  }
}

// Sửa lại hàm tạo Mail: Chuyển sang gọi GET theo chuẩn route của TempMail
async function createMail() {
  const btn = document.getElementById('btnCreate');
  let user = document.getElementById('username').value.trim();
  const domain = document.getElementById('domain').value.trim() || 'tempmail.id.vn';

  if (!user) user = 'u' + Math.random().toString(36).substring(2, 8);

  btn.disabled = true;
  btn.innerText = 'Đang xử lý...';

  try {
    // Thử tạo bằng phương thức GET theo cú pháp endpoint
    let res;
    try {
      res = await apiRequest(`/email/create/${user}/${domain}`, 'GET');
    } catch (e) {
      // Fallback nếu endpoint yêu cầu query string
      res = await apiRequest(`/email/create?user=${encodeURIComponent(user)}&domain=${encodeURIComponent(domain)}`, 'GET');
    }

    log('Kết quả tạo mail: ' + JSON.stringify(res), 'success');

    // Lấy ID hòm thư trả về từ hệ thống
    currentMailId = res.id || res.data?.id || res.mail_id || res.data?.mail_id || res.email_id;
    currentFullEmail = `${user}@${domain}`;

    document.getElementById('currentEmail').value = currentFullEmail;
    document.getElementById('idInfo').innerText = `Mail ID: ${currentMailId || 'N/A'}`;
    document.getElementById('currentMailBox').classList.remove('hidden');

    fetchMessages();
    startPolling();
  } catch (err) {
    log('Lỗi tạo mail: ' + err.message, 'error');
    alert('Lỗi: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.innerText = 'Tạo Mail Mới';
  }
}

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      document.getElementById('pollStatus').classList.remove('hidden');
      pollInterval = setInterval(() => {
        fetchMessages(true);
      }, 5000);
    }

    async function fetchMessages(isSilent = false) {
      if (!currentMailId && !currentFullEmail) return;

      // Thử endpoint theo ID trước, nếu không có ID thì fallback sang chuỗi email
      const targetQuery = currentMailId || encodeURIComponent(currentFullEmail);

      try {
        const res = await apiRequest(`/email/${targetQuery}`, 'GET');
        
        let messages = [];
        if (Array.isArray(res)) messages = res;
        else if (Array.isArray(res.messages)) messages = res.messages;
        else if (Array.isArray(res.data)) messages = res.data;
        else if (Array.isArray(res.emails)) messages = res.emails;

        const list = document.getElementById('messageList');

        if (messages.length === 0) {
          list.innerHTML = '<li class="py-6 text-center text-slate-400">Đang chờ tin nhắn mới...</li>';
          return;
        }

        log(`Tìm thấy ${messages.length} thư mới!`, 'success');

        list.innerHTML = messages.map(msg => {
          const id = msg.id || msg.message_id || msg._id;
          const subject = msg.subject || msg.title || '(Không tiêu đề)';
          const from = msg.from || msg.sender || 'Không rõ';

          return `
            <li class="py-3 flex justify-between items-center cursor-pointer hover:bg-slate-50 px-2 rounded transition" onclick="readMessage('${id}')">
              <div class="overflow-hidden pr-2">
                <p class="font-medium text-slate-800 truncate">${escapeHtml(subject)}</p>
                <p class="text-xs text-slate-400 truncate">Từ: ${escapeHtml(from)}</p>
              </div>
              <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded font-medium shrink-0">Đọc</span>
            </li>
          `;
        }).join('');
      } catch (err) {
        if (!isSilent) log('Lỗi đọc danh sách thư: ' + err.message, 'error');
      }
    }

    async function readMessage(msgId) {
      if (!msgId || msgId === 'undefined') return alert('ID thư không hợp lệ');

      try {
        const res = await apiRequest(`/message/${msgId}`, 'GET');
        log('Dữ liệu chi tiết thư: ' + JSON.stringify(res), 'success');

        const msg = res.message || res.data || res;
        document.getElementById('msgSubject').innerText = msg.subject || '(Không tiêu đề)';
        document.getElementById('msgSender').innerText = `Từ: ${msg.from || ''}`;
        document.getElementById('msgBody').innerHTML = msg.html || msg.body_html || `<p>${escapeHtml(msg.text || msg.body || '(Nội dung trống)')}</p>`;
        
        const detailBox = document.getElementById('messageDetail');
        detailBox.classList.remove('hidden');
        detailBox.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        log('Lỗi đọc thư: ' + err.message, 'error');
        alert('Không đọc được thư: ' + err.message);
      }
    }

    function copyMail() {
      const val = document.getElementById('currentEmail').value;
      navigator.clipboard.writeText(val);
      log('Đã sao chép: ' + val);
      alert('Đã copy!');
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }
  </script>
</body>
</html>
