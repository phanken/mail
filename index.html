<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trình Quản Lý Mail Ảo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <header class="text-center">
      <h1 class="text-2xl md:text-3xl font-bold text-indigo-600">Trình Quản Lý Mail Ảo</h1>
      <p class="text-slate-500 text-xs mt-1">Tự động kết nối bảo mật qua Cloudflare Worker</p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Cột trái: Quản lý & Tạo Email -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="font-semibold text-sm uppercase text-slate-500 tracking-wider">Tạo Hộp Thư</h2>
        
        <div>
          <label class="text-xs font-medium text-slate-600">Tên hòm thư (User)</label>
          <input type="text" id="username" placeholder="Để trống để tạo ngẫu nhiên" class="w-full border rounded-lg px-3 py-2 text-sm mt-1 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
  <label class="text-xs font-medium text-slate-600">Tên miền (Domain)</label>
  <div class="space-y-2 mt-1">
    <!-- Dropdown chọn domain -->
    <select id="domainSelect" onchange="handleDomainChange()" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
      <option value="tempmail.id.vn">tempmail.id.vn</option>
      <option value="1trick.net">1trick.net</option>
	  <option value="hathitrannhien.edu.vn">hathitrannhien.edu.vn</option>
	  <option value="nghienplus.store">nghienplus.store</option>
	  <option value="nghienplus.io.vn">nghienplus.io.vn</option>
      <option value="custom">-- Nhập tên miền tùy chỉnh --</option>
    </select>
    
    <!-- Ô nhập domain thủ công (chỉ hiện khi chọn 'custom') -->
    <input type="text" id="customDomainInput" placeholder="Ví dụ: mydomain.com" class="hidden w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
  </div>
</div>

        <button id="btnCreate" onclick="createMail()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium text-sm transition">
          Tạo Mail Mới
        </button>

        <div id="currentMailBox" class="hidden pt-4 border-t border-slate-100 space-y-2">
          <label class="text-xs font-medium text-slate-600">Email đang dùng:</label>
          <div class="flex items-center gap-2">
            <input type="text" id="currentEmail" readonly class="w-full bg-slate-50 border rounded-lg px-2 py-1.5 text-xs font-mono">
            <button onclick="copyMail()" class="text-xs bg-slate-200 hover:bg-slate-300 px-2 py-1.5 rounded">Copy</button>
          </div>
          <p id="idInfo" class="text-[11px] text-slate-400 font-mono"></p>
        </div>
      </div>

      <!-- Cột phải: Hộp thư đến -->
      <div class="md:col-span-2 space-y-4">
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-4">
            <h2 class="font-semibold text-sm uppercase text-slate-500 tracking-wider flex items-center gap-2">
              Hộp Thư Đến
              <span id="pollStatus" class="hidden text-xs text-indigo-500 font-normal animate-pulse">● Đang quét thư mới</span>
            </h2>
            <button onclick="fetchMessages()" class="text-xs text-indigo-600 hover:underline font-medium">🔄 Làm mới ngay</button>
          </div>

          <ul id="messageList" class="divide-y divide-slate-100 text-sm">
            <li class="py-6 text-center text-slate-400">Chưa tạo hòm thư</li>
          </ul>
        </div>

        <!-- Chi tiết thư -->
        <div id="messageDetail" class="hidden bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-3">
          <div class="border-b pb-3 flex justify-between items-start">
            <div>
              <h3 id="msgSubject" class="font-bold text-base text-slate-800"></h3>
              <p id="msgSender" class="text-xs text-slate-500 mt-1"></p>
            </div>
            <button onclick="document.getElementById('messageDetail').classList.add('hidden')" class="text-slate-400 hover:text-slate-600 text-sm">✕ Đóng</button>
          </div>
          <div id="msgBody" class="text-sm text-slate-700 leading-relaxed overflow-x-auto bg-slate-50 p-4 rounded-lg"></div>
        </div>
      </div>
    </div>

    <!-- Live Debug Log -->
    <div class="bg-slate-900 text-slate-200 p-4 rounded-xl text-xs font-mono space-y-2">
      <div class="flex justify-between items-center text-slate-400 pb-2 border-b border-slate-800">
        <span>Bảng Nhật Ký API (Realtime)</span>
        <button onclick="document.getElementById('debugLog').innerText=''" class="hover:text-white">Xóa log</button>
      </div>
      <div id="debugLog" class="max-h-48 overflow-y-auto space-y-1">Chưa có hoạt động...</div>
    </div>

  </div>

  <script>
    // ⚠️ ĐIỀN CHÍNH XÁC LINK WORKER CỦA BẠN VÀO ĐÂY
    const WORKER_URL = 'https://mail.phanken-net.workers.dev';

    let currentMailId = null;
    let currentFullEmail = null;
    let pollInterval = null;

    function log(msg, type = 'info') {
      const box = document.getElementById('debugLog');
      const time = new Date().toLocaleTimeString();
      const color = type === 'error' ? 'text-red-400 font-semibold' : (type === 'success' ? 'text-emerald-400 font-semibold' : 'text-slate-300');
      box.innerHTML = `<div class="${color}">[${time}] ${escapeHtml(msg)}</div>` + box.innerHTML;
    }

    function handleDomainChange() {
      const select = document.getElementById('domainSelect');
      const customInput = document.getElementById('customDomainInput');
      if (select.value === 'custom') {
        customInput.classList.remove('hidden');
        customInput.focus();
      } else {
        customInput.classList.add('hidden');
      }
    }

    // Gửi yêu cầu qua Worker (Không cần đính kèm Token từ máy khách)
    async function apiRequest(endpoint, method = 'GET', body = null) {
      const cleanEndpoint = endpoint.startsWith('/') ? endpoint : `/${endpoint}`;
      const targetUrl = `${WORKER_URL.replace(/\/+$/, '')}${cleanEndpoint}`;

      const options = {
        method,
        headers: { 'Accept': 'application/json' }
      };

      if (body) {
        options.headers['Content-Type'] = 'application/json';
        options.body = JSON.stringify(body);
      }

      log(`Gửi ${method} -> ${cleanEndpoint}`);

      const res = await fetch(targetUrl, options);
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error(`Phản hồi không phải JSON (${res.status}): ${text.slice(0, 120)}`);
      }
    }

    async function createMail() {
      const btn = document.getElementById('btnCreate');
      let user = document.getElementById('username').value.trim();
      
      const domainSelect = document.getElementById('domainSelect').value;
      let domain = domainSelect;
      if (domainSelect === 'custom') {
        domain = document.getElementById('customDomainInput').value.trim();
        if (!domain) return alert('Vui lòng nhập tên miền tùy chỉnh!');
      }

      if (!user) user = 'u' + Math.random().toString(36).substring(2, 8);

      btn.disabled = true;
      btn.innerText = 'Đang tạo...';

      try {
        const res = await apiRequest('/email/create', 'POST', { user, domain });
        log('Kết quả tạo mail: ' + JSON.stringify(res), 'success');

        currentMailId = res.id || res.data?.id || res.mail_id || res.data?.mail_id;
        currentFullEmail = res.email || res.data?.email || `${user}@${domain}`;

        if (currentMailId) {
          document.getElementById('currentEmail').value = currentFullEmail;
          document.getElementById('idInfo').innerText = `Mail ID: ${currentMailId}`;
          document.getElementById('currentMailBox').classList.remove('hidden');

          fetchMessages();
          startPolling();
        }
      } catch (err) {
        log('Lỗi tạo mail: ' + err.message, 'error');
        alert('Lỗi: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Tạo Mail Mới';
      }
    }

    function startPolling() {
      if (pollInterval) clearInterval(pollInterval);
      document.getElementById('pollStatus').classList.remove('hidden');
      pollInterval = setInterval(() => {
        fetchMessages(true);
      }, 5000);
    }

    async function fetchMessages(isSilent = false) {
      if (!currentMailId) return;

      try {
        const res = await apiRequest(`/email/${currentMailId}?_t=${Date.now()}`, 'GET');
        const messages = res.data?.items || res.items || res.data || [];
        const list = document.getElementById('messageList');

        if (!Array.isArray(messages) || messages.length === 0) {
          list.innerHTML = '<li class="py-6 text-center text-slate-400">Hòm thư chưa có tin nhắn mới...</li>';
          return;
        }

        if (!isSilent) log(`Đã tải: ${messages.length} thư!`, 'success');

        list.innerHTML = messages.map(msg => {
          const id = msg.id;
          const subject = msg.subject || '(Không tiêu đề)';
          const sender = msg.sender_name ? `${msg.sender_name} <${msg.from}>` : (msg.from || 'Không rõ');
          const time = msg.created_at ? new Date(msg.created_at).toLocaleTimeString() : '';

          return `
            <li class="py-3.5 flex justify-between items-center cursor-pointer hover:bg-slate-50 px-2 rounded transition border-b last:border-0" onclick="readMessage('${id}')">
              <div class="overflow-hidden pr-3">
                <div class="flex items-center gap-2">
                  <p class="font-medium text-slate-800 truncate">${escapeHtml(subject)}</p>
                  ${time ? `<span class="text-[10px] text-slate-400 shrink-0">${time}</span>` : ''}
                </div>
                <p class="text-xs text-indigo-600 truncate mt-0.5">${escapeHtml(sender)}</p>
              </div>
              <button class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-600 px-3 py-1.5 rounded-md font-medium shrink-0">Đọc thư</button>
            </li>
          `;
        }).join('');
      } catch (err) {
        if (!isSilent) log('Lỗi đọc hòm thư: ' + err.message, 'error');
      }
    }

    async function readMessage(msgId) {
      if (!msgId) return;

      try {
        const res = await apiRequest(`/message/${msgId}`, 'GET');
        log('Nội dung thư: ' + JSON.stringify(res), 'success');

        const msg = res.data || res.message || res;
        document.getElementById('msgSubject').innerText = msg.subject || '(Không tiêu đề)';
        document.getElementById('msgSender').innerText = `Từ: ${msg.sender_name || ''} <${msg.from || ''}> | Gửi đến: ${msg.to || ''}`;
        
        const content = msg.html || msg.body_html || msg.text || msg.body || '(Thư không có nội dung)';
        document.getElementById('msgBody').innerHTML = content;
        
        const detailBox = document.getElementById('messageDetail');
        detailBox.classList.remove('hidden');
        detailBox.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        log('Lỗi đọc thư: ' + err.message, 'error');
        alert('Không tải được nội dung: ' + err.message);
      }
    }

    function copyMail() {
      const val = document.getElementById('currentEmail').value;
      navigator.clipboard.writeText(val);
      alert('Đã copy: ' + val);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));
    }
  </script>
</body>
</html>
